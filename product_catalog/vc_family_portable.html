<title>虚拟细胞产品图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Serif+SC:wght@500;600&display=swap">
<style>
:root{
  --ink:#0d1720; --navy:#102836; --paper:#f3f0e9; --white:#fffdf8;
  --muted:#667078; --line:#0d172024; --line2:#0d172040;
  --lime:#c9ee45; --coral:#ff8a6b; --blue:#77b8ff; --violet:#b6a3ff; --amber:#ffc857;
  --band:#e2ded5;
  --serif:Georgia,"Noto Serif SC",serif;
  --sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
.shell{width:min(1240px,100% - 48px);margin:0 auto}
.pad{padding-top:88px;padding-bottom:88px}
.pad-s{padding-top:56px;padding-bottom:56px}

/* nav */
.nav{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:var(--paper)}
.nav-in{width:min(1380px,100% - 48px);margin:0 auto;height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:750;letter-spacing:-.01em}
.brand-mark{background:var(--ink);color:var(--lime);width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:14px}
.nav-links{display:flex;align-items:center;gap:26px;font-size:12.5px;color:#34414a;flex-wrap:wrap}
.nav-links a:hover{color:#000}
.nav-cta{border:1px solid var(--ink);border-radius:100px;padding:8px 15px}

/* generic type */
.kicker{font:800 10px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:9px;font:800 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#50616d}
.eyebrow i{background:var(--lime);width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 4px #c9ee4538;font-style:normal}
h1.big{font-family:var(--serif);font-weight:500;letter-spacing:-.055em;line-height:1.02;font-size:clamp(42px,6vw,80px)}
h2.mid{font-family:var(--serif);font-weight:500;letter-spacing:-.03em;line-height:1.16;font-size:clamp(28px,3.6vw,42px)}
h3.sm{font-family:var(--serif);font-weight:500;font-size:23px;letter-spacing:-.02em}
p.lede{color:#4f5d66;line-height:1.85;max-width:70ch}
.mut{color:var(--muted)}
.crumb{font:10px var(--mono);letter-spacing:.1em;color:var(--muted);padding:16px 0;display:flex;gap:7px;flex-wrap:wrap}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tagrow b{border:1px solid var(--line);background:#ffffff70;padding:6px 11px;font-size:11px;font-weight:650}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:70px;align-items:center;padding:68px 0 78px}
.hero-r{border-left:1px solid var(--line);padding-left:34px}
.hero-r strong{display:block;font:500 22px/1.5 var(--serif);margin-bottom:16px}
.hero-r p{color:var(--muted);line-height:1.8;font-size:14px}
.btnrow{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.button{border:1px solid var(--ink);border-radius:3px;padding:12px 20px;font-size:12.5px;font-weight:700;display:inline-block}
.button.primary{background:var(--lime);border-color:var(--lime)}
.button:hover{background:var(--ink);color:var(--white);border-color:var(--ink)}
.button.primary:hover{background:var(--ink);color:var(--lime)}

/* count band */
.band{background:var(--navy);color:#fff}
.band-in{display:grid;grid-template-columns:repeat(5,1fr)}
.band-in span{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:20px;min-height:110px;border-right:1px solid #ffffff1f;font:9px var(--mono);letter-spacing:.09em;color:#9eb0ba}
.band-in span:last-child{border-right:0}
.band-in b{color:var(--lime);font:500 24px var(--serif);letter-spacing:-.02em}

/* section heading */
.sechead{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end;margin-bottom:34px}
.sechead p.lede{font-size:14.5px}

/* line cards */
.linegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.linecard{border:1px solid var(--line);background:#ffffff7a;padding:28px;min-height:400px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.linecard:after{content:"";position:absolute;top:-75px;right:-75px;width:150px;height:150px;border-radius:50%;background:var(--acc)}
.linecard:hover{transform:translateY(-4px);box-shadow:0 20px 45px #0d172014}
.linecard>span{font:10px var(--mono);letter-spacing:.08em}
.linecard>p.lbl{margin:52px 0 9px;font:800 10px var(--mono);letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.linecard>h2{font:500 30px/1.2 var(--serif);letter-spacing:-.03em;margin:0;max-width:22ch}
.linecard>small{color:var(--muted);margin-top:10px;font-size:12.5px;line-height:1.7;display:block;max-width:40ch}
.linecard ul{border-top:1px solid var(--line);margin:auto 0 0;padding-top:2px}
.linecard li{border-bottom:1px solid var(--line);padding:10px 0;font-size:12px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.linecard li:last-child{border-bottom:0}
.linecard li em{font-style:normal;font:10px var(--mono);color:var(--muted);white-space:nowrap}

/* matrix table */
.tw{overflow-x:auto;border:1px solid var(--line);background:#ffffff70}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
th,td{text-align:left;padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
thead th{background:#ffffffa8;font:800 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.k{font-weight:700;white-space:nowrap}
td.m,.m{font:12px var(--mono)}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.d3{background:var(--ink)} .d2{background:#0d172070} .d1{background:#0d172018;border:1px solid var(--line2)}

/* bounds */
.bounds{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.bound{border:1px solid var(--line);background:#ffffff73;padding:24px;border-top:5px solid var(--bc)}
.bound h4{font:800 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.bound>p{font:500 19px/1.35 var(--serif);margin-bottom:16px;letter-spacing:-.01em}
.bound li{font-size:12.5px;line-height:1.65;padding:8px 0;border-top:1px solid var(--line);display:flex;gap:9px}
.bound li:before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--bc);margin-top:8px}

/* steps (5-step spine) */
.steps{border-top:1px solid var(--line)}
.steps article{border-bottom:1px solid var(--line);display:grid;grid-template-columns:70px 200px 1fr;gap:26px;align-items:baseline;padding:20px 0}
.steps span{font:11px var(--mono);color:#7d8a92}
.steps h4{font:500 19px var(--serif);letter-spacing:-.015em}
.steps p{color:var(--muted);font-size:13.5px;line-height:1.75}

/* solution cards */
.solgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.solcard{border:1px solid var(--line);background:#ffffff73;padding:22px 24px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:background .15s}
.solcard:hover{background:var(--white)}
.solcard span{font:10px var(--mono);letter-spacing:.08em;color:var(--muted)}
.solcard h4{font:500 21px/1.3 var(--serif);letter-spacing:-.02em}
.solcard small{color:var(--muted);font:11.5px var(--mono)}
.solcard b{margin-top:auto;padding-top:12px;font-size:11.5px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center}
.solcard b i{font-style:normal;color:var(--muted)}

/* detail hero */
.dhero{display:grid;grid-template-columns:150px 1.1fr .9fr;gap:44px;align-items:center;padding:56px 0 66px}
.didx{font:10px var(--mono);letter-spacing:.14em;color:var(--muted);align-self:start;padding-top:12px}
.dtitle p.code{display:inline-block;background:var(--acc);padding:8px 12px;font:800 11px var(--mono);letter-spacing:.12em;margin-bottom:16px}
.dtitle h1{font:500 clamp(38px,5vw,66px)/1.03 var(--serif);letter-spacing:-.05em}
.dpromise{border-left:1px solid var(--line);padding-left:32px}
.dpromise strong{display:block;font:500 21px/1.5 var(--serif)}
.dpromise p{color:var(--muted);margin:16px 0 0;line-height:1.8;font-size:13.5px}

/* endpoint */
.endpoint{background:var(--band);border-block:1px solid var(--line)}
.epgrid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-top:26px}
.epgrid div{background:#ffffff73;border-right:1px solid var(--line);padding:22px;min-height:112px}
.epgrid div:last-child{border-right:0}
.epgrid strong{display:block;font:500 30px var(--serif);color:#173042;letter-spacing:-.03em}
.epgrid span{display:block;color:var(--muted);margin-top:7px;font-size:11px;line-height:1.55}

/* workflow (navy) */
.wf{background:var(--navy);color:#fff}
.wf .kicker{color:#8fa3ae}
.wf h2{color:#fff}
.wf p.lede{color:#c8d5da}
.wftable{overflow-x:auto;margin-top:30px;border-top:1px solid #ffffff2b}
.wftable table{min-width:820px}
.wftable th,.wftable td{border-bottom:1px solid #ffffff1c;color:#d5dfe3;padding:16px 18px}
.wftable th{color:var(--lime);font:800 10px var(--mono);letter-spacing:.1em;background:none;text-transform:uppercase}
.wftable td.n{font:11px var(--mono);color:var(--lime);white-space:nowrap}
.wftable td.f{font:11px var(--mono);color:#9fb4bf;white-space:nowrap}
.wftable td.g{font-size:12px;color:#a9bcc5}

/* case workpackage */
.case4{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:28px}
.case4 article{border:1px solid var(--line);background:#ffffff73;padding:24px;min-height:230px}
.case4 span{font:10px var(--mono);letter-spacing:.1em;color:var(--muted)}
.case4 h4{font:500 22px var(--serif);margin:32px 0 10px;letter-spacing:-.02em}
.case4 p{font-size:12.5px;line-height:1.7;color:#3f4c54}
.exit{background:var(--acc);padding:18px 22px;font-size:12.5px;line-height:1.65;margin-top:2px}

/* spec */
.spec{background:var(--band);border-block:1px solid var(--line)}
.spectable{border:1px solid var(--line);background:#ffffff73}
.spectable>div{display:grid;grid-template-columns:150px 1fr;gap:22px;padding:15px 22px;border-bottom:1px solid var(--line);align-items:baseline}
.spectable>div:last-child{border-bottom:0}
.spectable span{font:800 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spectable p{font-size:13.5px;line-height:1.7}

/* related */
.rel{display:flex;flex-wrap:wrap;gap:2px;margin-top:22px}
.rel a{border:1px solid var(--line);background:#ffffff73;padding:14px 18px;font-size:12.5px;display:flex;gap:12px;align-items:center;flex:1 1 240px}
.rel a:hover{background:var(--white)}
.rel a em{font-style:normal;font:10px var(--mono);color:var(--muted)}
.rel a i{font-style:normal;margin-left:auto;color:var(--muted)}

.note{border:1px solid var(--line);background:#ffffff8f;padding:18px 22px;font-size:13px;line-height:1.75;color:#3f4c54}
.note b{color:var(--ink)}
.pilot{background:var(--coral);padding:46px 52px;display:flex;justify-content:space-between;align-items:flex-end;gap:44px;flex-wrap:wrap}
.pilot .kicker{color:#733b30}
.pilot h2{font:500 34px/1.2 var(--serif);letter-spacing:-.03em;margin:10px 0 12px}
.pilot p{max-width:62ch;line-height:1.7;font-size:13.5px}

.foot{border-top:1px solid var(--line);min-height:110px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot p{color:var(--muted);font-size:10px;line-height:1.8}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

@media (max-width:980px){
  .hero,.dhero,.sechead{grid-template-columns:1fr;gap:28px}
  .hero-r,.dpromise{border-left:0;border-top:1px solid var(--line);padding:26px 0 0}
  .didx{padding:0}
  .linegrid,.solgrid,.bounds,.case4{grid-template-columns:1fr}
  .epgrid{grid-template-columns:1fr 1fr}
  .band-in{grid-template-columns:1fr 1fr}
  .band-in span{border-bottom:1px solid #ffffff1f}
  .steps article{grid-template-columns:52px 1fr;gap:14px}
  .steps p{grid-column:2}
  .spectable>div{grid-template-columns:1fr;gap:6px}
  .nav-links a:not(.nav-cta){display:none}
  .pilot{padding:34px 26px}
}
</style>

<nav class="nav"><div class="nav-in">

</div></nav>

<div id="app"></div>

<script>
const D = {
  family: {
    code:"VC", name:"虚拟细胞与体外替身",
    tagline:"先证明有可建模余量，再决定要不要建模。",
    lede:"虚拟细胞不是一个端到端模型，是一张细胞系状态卡加上若干个各自可单独证伪的预测模块。这个家族按<b>细胞系</b>和<b>适应症</b>组织产品：每条产品线只承诺它在有底座的细胞系内部能做的排序与预筛，并把不能承诺的部分写进交付物。",
    promise:"结算口径是富集倍数，不是相关系数。",
    promiseP:"一个虚拟筛的价值，等于它把湿实验从「全测」压缩到「排序后测」省下的孔数，减去漏掉真阳性的代价。所以每个项目的验收表里都有富集倍数、召回率和每个真阳性的实验成本——这三个数才和实验预算对得上账。"
  },
  bounds: {
    ok: { t:"直接替代", c:"var(--lime)", d:"干湿同精度，可以省掉实验。这一档大部分不是建模，是查库——最容易被忽略的效率来源。", items:[
      "靶点在该系的表达、拷贝数、突变与融合状态（CCLE 直接查）",
      "该靶点在该系是否为必需基因（DepMap CRISPR 直接查，比任何模型都准）",
      "化合物结构警报：PAINS / Brenk / NIH 干扰子与类药性",
      "sgRNA 全基因组脱靶枚举与 CFD 特异性打分（穷举，不是预测）",
      "细胞系身份与交叉污染核对（STR / SNP 指纹）"
    ]},
    mid: { t:"排序后测", c:"var(--blue)", d:"只能排序，仍需实验确认，但能把实验量压下一个量级。所有 VC 产品的主战场都在这一档。", items:[
      "化合物的转录响应方向与 MoA 归类（须先打赢 L1000 检索基线）",
      "单基因敲低的下游通路——仅限该系有扰动底座覆盖的靶点及邻域",
      "化合物–靶点结合排序（指标要选对：opt_score ρ≈+0.6，binding_confidence ρ≈−0.2）",
      "n² 组合空间的优先级排序",
      "启动子 / 剪接变异的顺式效应（须带 ±40bp 位置置换对照）",
      "网络失稳早期预警：方差与 lag-1 自相关在分岔点附近上升"
    ]},
    no: { t:"不承诺", c:"var(--coral)", d:"已经实测会失败的外推。写进合同的排除条款，而不是藏在脚注里。", items:[
      "外推到没有扰动底座的新细胞系——oracle 上下文特征比不给还差",
      "CRISPRa / 过表达 / 敲入后果——敲低训练的模型迁过去 r=0.009，等于掷骰子",
      "绝对 IC50 与完整剂量–响应曲线，只排序不给数",
      "时间动力学、代谢物浓度与滴度（FBA 的定义就给不了）",
      "从细胞系外推到患者响应",
      "监管级毒理放行结论"
    ]}
  },
  matrix: {
    head:["细胞系","来源 / 适应症背景","扰动底座","化合物底座","形态底座","可支撑的产品线"],
    rows:[
      ["K562","CML · BCR-ABL 阳性","full","part","none","CellTwin · PerturbSim · ToxTwin · ResistSim"],
      ["RPE1","视网膜色素上皮 · 近二倍体非癌","full","none","none","CellTwin（对照）· PerturbSim"],
      ["MCF7","乳腺癌 ER+","none","full","part","CellTwin · PhenoScreen · ResistSim · CombiRank"],
      ["A549","肺腺癌 · KRAS 突变","none","full","full","CellTwin · PhenoScreen · CombiRank"],
      ["U2OS","骨肉瘤 · 形态筛主力","none","none","full","CellTwin · PhenoScreen"],
      ["HepG2","肝癌 · 肝毒性代理","part","full","none","CellTwin · ToxTwin"],
      ["Jurkat","T 细胞白血病 · 免疫代理","part","none","none","PerturbSim"],
      ["PC9 / HCC827","肺腺癌 · EGFR 敏感突变","none","part","none","ResistSim"],
      ["客户自有系","按项目","按项目","按项目","按项目","先做 CellTwin 可行性判定"]
    ]
  },
  lines: [
    {
      slug:"celltwin-ai", code:"VC-TWN", name:"CellTwin-AI", title:"细胞系虚拟替身构建",
      acc:"var(--lime)", axis:"按细胞系",
      q:"这条细胞系的基线状态、可建模余量和噪声天花板是多少，够不够支撑后续任何虚拟筛？",
      promise:"所有 VC 产品的地基。没有这一步，后面每个模型分数都没有参照系。",
      promiseP:"我们先算重复孔之间的一致性上限（噪声天花板），再跑完整基线阶梯——训练集平均位移、最近邻检索、线性加性、oracle 上界。如果基线已经贴顶，这条系的这个 readout 就没有可建模余量，我们会直接说不要建，换 readout 或换系。",
      steps:[
        ["标准输入","细胞系身份、可用组学与扰动数据、目标 readout、实验容量"],
        ["候选生成","CCLE / DepMap / ENCODE 基线拉取，与系内扰动语料对齐"],
        ["证据校准","重复孔一致性算噪声天花板；四层基线阶梯；预训练语料污染审计"],
        ["组合选择","可建模 readout 清单、不可建模清单、建库缺口与优先级"],
        ["实验输出","状态卡 + 基线表 + 可建模余量报告 + go/no-go"]
      ],
      qc:"确认细胞系编号、批次、传代、组学版本与扰动数据的样本对应关系，核对 STR 身份。",
      gen:"拉取表达、突变、拷贝数、融合、甲基化、染色质可及性与倍性，对齐系内扰动语料的基因空间。",
      cal:"计算重复孔噪声天花板，跑四层基线阶梯，并按 accession 集合求交做预训练语料污染审计。",
      sel:"按「占噪声天花板百分比」给出每个 readout 的可建模余量，划分可建模 / 不可建模 / 需补数据三档。",
      out:"输出细胞系状态卡、基线得分表、污染审计判定原文与建库缺口清单。",
      loop:"回收首轮实测数据，更新噪声天花板与基线，重判可建模余量。",
      exit:"每个 readout 都有噪声天花板和基线得分，go/no-go 有据可依。",

const dot = v => v==="full" ? '<span class="dt d3"></span> 全' : v==="part" ? '<span class="dt d2"></span> 部分' : v==="none" ? '<span class="dt d1"></span> 无' : E(v);
const lineBy = s => D.lines.find(l => l.slug === s);
const solId = (l,s) => `${l.code}-${s[0]}`;
const findSol = id => { for (const l of D.lines) for (const s of l.sols) if (solId(l,s)===id) return [l,s]; return []; };

const nn = i => String(i+1).padStart(2,'0');
const foot = `<footer class="shell"><div class="foot"><a class="brand" href="#/"><span class="brand-mark">Q</span>QureGen BioDecision</a><p>Research use only · 案例均标注数据来源、适用域与验证边界。<br>演示数量为产品范围示意；正式项目的数量、阈值与候选名称由客户数据与预先约定的实验容量确定。</p></div></footer>`;

const stepsHTML = steps => `<div class="steps">${steps.map((s,i)=>
  `<article><span>${nn(i)}</span><h4>${E(s[0])}</h4><p>${E(s[1])}</p></article>`).join('')}</div>`;

const boundsHTML = () => `<div class="bounds">${['ok','mid','no'].map(k => {
  const b = D.bounds[k];
  return `<div class="bound" style="--bc:${b.c}"><h4>${E(b.t)}</h4><p>${E(b.d.split('。')[0])}。</p><ul>${b.items.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`;
}).join('')}</div>`;

const specHTML = (l, sol) => `<div class="spectable">
  ${sol?`<div><span>产品编号</span><p class="m">${E(solId(l,sol))}</p></div>`:''}
  <div><span>技术领域</span><p>${E(l.domain)}</p></div>
  <div><span>解决方案</span><p>${E(sol?sol[1]:l.title)}</p></div>
  ${sol?`<div><span>具体标的</span><p class="m">${E(sol[2])}</p></div>`:''}
  <div><span>研发价值</span><p>${E(l.value)}</p></div>
  <div><span>标准交付</span><p>${E(l.deliver)}</p></div>
  <div><span>交付格式 / 接口</span><p class="m">${E(l.formats)}</p></div>
  <div><span>适用团队</span><p>${E(l.teams)}</p></div>
  <div><span>应用场景</span><p>${sol?E(sol[3])+'；':''}${E(l.scene)}</p></div>
  <div><span>兼容工具</span><p>${E(l.tools)}</p></div>
  <div><span>能力边界</span><p>直接替代：${E(l.bounds.ok)}　·　排序后测：${E(l.bounds.mid)}　·　<b>不承诺：${E(l.bounds.no)}</b></p></div>
  <div><span>项目范围</span><p>${E(l.price)}</p></div>
</div>`;

function matrixTable(){
  return `<div class="tw"><table><thead><tr>${D.matrix.head.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>
    ${D.matrix.rows.map(r=>`<tr><td class="k">${E(r[0])}</td><td class="m">${E(r[1])}</td>
      <td class="m">${dot(r[2])}</td><td class="m">${dot(r[3])}</td><td class="m">${dot(r[4])}</td>
      <td>${E(r[5])}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function pageMatrix(){
  return `<div class="shell"><div class="crumb"><a href="#/">VC 家族总览</a> / 细胞系底座矩阵</div></div>
  <section class="shell pad-s">
    <p class="eyebrow"><i></i>Cell-line substrate matrix</p>
    <h1 class="big" style="margin:22px 0;font-size:clamp(36px,5vw,62px)">按细胞系立项，不按模型立项。</h1>

      </tbody></table></div>
    </div>

function pageSolution(id){
  const [l,s]=findSol(id); if(!l) return pageFamily();
  const j=l.sols.indexOf(s), subj=s[2], use=s[3], ep=s[4];
  const chain=ep.split('→').map(x=>x.trim());
  const phases=[
    ["1. 项目定义",`围绕「${subj}」冻结主目标、应用场景、实验容量、硬约束、对照和成功标准。`,"project_spec.yaml · 验收指标表","目标可量化；实验 readout 已确定"],
    ["2. 数据接入与 QC",l.qc,"input_manifest.csv · input_qc.html","关键字段、版本、编号和样本关系通过"],
    ["3. 候选空间生成",`${l.steps[1][1]}；${l.gen}`,"candidate_space.parquet · 排除记录","候选可追溯、可制造 / 可测定"],
    ["4. 多证据校准",`${l.steps[2][1]}；${l.cal}`,"evidence_matrix.csv · calibration.html","适用域、冲突证据和不确定性已标记"],
    ["5. 约束组合选择",`${l.steps[3][1]}；${l.sel}`,"selected_panel.csv · decision_log.json","硬约束零违例；组合覆盖达标"],
    ["6. 实验就绪交付",`${l.steps[4][1]}；${l.out}`,"experiment_package · plate_map / constructs","对照、板位、判读与异常处理可执行"],
    ["7. 数据回流与下一轮",l.loop,"round2_plan.html · 更新后的证据资产",l.exit]
  ];
  return `
  <div class="shell"><div class="crumb"><a href="#/">VC 家族总览</a> / <a href="#/lines/${l.slug}">${E(l.name)}</a> / ${E(id)}</div></div>
  <header class="shell" style="--acc:${l.acc}"><div class="dhero">
    <div class="didx">${nn(j)} / ${nn(l.sols.length-1)}<br>${E(l.code)}<br>${E(l.axis)}</div>
    <div class="dtitle"><p class="code">${E(id)}</p><h1>${E(s[1])}</h1>
      <div class="tagrow"><b>${E(l.name)} · ${E(l.title)}</b><b class="m">${E(subj)}</b><b>${E(use)}</b></div></div>
    <div class="dpromise"><strong>${E(l.q)}</strong><p>${E(l.promiseP)}</p></div>
  </div></header>

  <section class="endpoint"><div class="shell pad-s">
    <p class="kicker">Method spine</p>
    <h2 class="mid" style="margin:12px 0 20px">五步骨架，落到「${E(subj)}」。</h2>
    ${stepsHTML([
      [l.steps[0][0], `${subj}；${l.steps[0][1]}`],
      l.steps[1], l.steps[2], l.steps[3],
      [l.steps[4][0], `${s[1]}：${l.steps[4][1]}`]
    ])}
    <p class="kicker" style="margin-top:38px">Demo / product endpoint</p>
    <h2 class="mid" style="margin:10px 0 0">${E(ep)}</h2>
    <div class="epgrid">
      ${chain.map(c=>{
        const m=c.match(/[~≈]?\d[\d,.]*\s*[万千kK%×]?/);
        const head=m?m[0].trim():c;
        return `<div><strong${m?'':' style="font-size:22px"'}>${E(head)}</strong><span>${E(c)}</span></div>`;
      }).join('')}
      ${chain.length<4?`<div><strong>${E(use)}</strong><span>应用案例</span></div>`:''}
      ${chain.length<3?`<div><strong>${E(l.price)}</strong><span>项目范围</span></div>`:''}
    </div>
    <div class="note" style="margin-top:18px">合成演示数据，用于展示产品数量级和实验终点。正式项目中的数量、阈值与候选名称由客户数据和预先约定的实验容量确定。</div>
  </div></section>

  <section class="wf"><div class="shell pad">
    <p class="kicker">Project implementation</p>
    <h2 class="mid" style="margin:12px 0 12px">把五步方法，落实为可验收的项目流程。</h2>
    <p class="lede">每一步都定义实际工作、阶段文件和退出条件。客户数据不会直接进入黑箱排名；版本、排除原因、模型分歧与实验回流均保留在项目记录中。</p>
    <div class="wftable"><table><thead><tr><th>阶段</th><th>实际实施内容</th><th>阶段输出</th><th>决策门</th></tr></thead><tbody>
      ${phases.map(p=>`<tr><td class="n">${E(p[0])}</td><td>${E(p[1])}</td><td class="f">${E(p[2])}</td><td class="g">${E(p[3])}</td></tr>`).join('')}
    </tbody></table></div>
  </div></section>

  <section class="shell pad" style="--acc:${l.acc}">
    <p class="kicker">Case workpackage</p>
    <h2 class="mid" style="margin:12px 0 10px">${E(s[1])}：从项目输入到下一轮实验。</h2>
    <p class="lede">示例实施场景 · 数量为产品范围演示。该案例用于展示项目规模、决策逻辑和交付形态。</p>
    <div class="case4">
      <article><span>01 / INPUT</span><h4>项目输入</h4><p>${E(subj)}。启动时冻结原始数据、项目目标、实验容量、硬约束及对照设计。</p></article>
      <article><span>02 / COMPUTE</span><h4>计算实施</h4><p>${E(l.gen)} ${E(l.cal)}</p></article>
      <article><span>03 / DECIDE</span><h4>组合决策</h4><p>${E(l.sel)}</p></article>
      <article><span>04 / LAB</span><h4>实验与回流</h4><p>${E(l.out)} ${E(l.loop)}</p></article>
    </div>
    <div class="exit"><b>CASE EXIT</b>　${E(l.exit)}　·　交付格式 ${E(l.formats)}</div>
    <div class="note" style="margin-top:24px"><b>本方案的能力边界。</b>直接替代：${E(l.bounds.ok)}。排序后测：${E(l.bounds.mid)}。<b>不承诺：${E(l.bounds.no)}</b>。</div>
  </section>

  <section class="spec"><div class="shell pad-s">
    <p class="kicker">Standard deliverables</p>
    <h2 class="mid" style="margin:12px 0 24px">从输入数据到实验可用资产</h2>
    ${specHTML(l,s)}
  </div></section>

  <section class="shell pad-s">
    <p class="kicker">Related solutions</p>
    <h2 class="mid" style="margin:12px 0 4px">${E(l.name)} 的相关专项方案</h2>
    <div class="rel">${l.sols.filter(x=>x!==s).map(x=>
      `<a href="#/catalog/${solId(l,x)}"><em>${E(solId(l,x))}</em>${E(x[1])}<i>↗</i></a>`).join('')}</div>
  </section>
  ${foot}`;
}

/* ---------- router ---------- */
function render(){
  const r=(location.hash.slice(1)||'/').split('?')[0];
  let html;
  if(r.startsWith('/lines/')) html=pageLine(r.slice(7));
  else if(r.startsWith('/catalog/')) html=pageSolution(r.slice(9));
  else if(r==='/matrix') html=pageMatrix();
  else if(r==='/bounds') html=pageBounds();
  else if(r==='/pilot') html=pagePilot();
  else html=pageFamily();
  document.getElementById('app').innerHTML=html;
  window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',render);
render();
</script>
