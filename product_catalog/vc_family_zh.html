<link rel="preconnect" href="https://fonts.googleapis.com">

  --muted:#667078; --line:#0d172024; --line2:#0d172040;
  --lime:#c9ee45; --coral:#ff8a6b; --blue:#77b8ff; --violet:#b6a3ff; --amber:#ffc857; --teal:#7fd4c1;
  --band:#e2ded5;
  --serif:Georgia,"Noto Serif SC",serif;
  --sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
.shell{width:min(1240px,100% - 48px);margin:0 auto}
.pad{padding-top:84px;padding-bottom:84px}
.pad-s{padding-top:54px;padding-bottom:54px}

.nav{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:var(--paper)}
.nav-in{width:min(1380px,100% - 48px);margin:0 auto;min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:750;letter-spacing:-.01em}
.brand-mark{background:var(--ink);color:var(--lime);width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:14px}
.nav-links{display:flex;align-items:center;gap:22px;font-size:12.5px;color:#34414a;flex-wrap:wrap}
.nav-links a:hover{color:#000}
.nav-cta{border:1px solid var(--ink);border-radius:100px;padding:8px 15px}
.lang{border:1px solid var(--line2);border-radius:100px;padding:6px 12px;font:10px var(--mono);letter-spacing:.1em}
.lang:hover{background:var(--ink);color:var(--white)}

.kicker{font:800 10px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:9px;font:800 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#50616d;flex-wrap:wrap}
.eyebrow i{background:var(--lime);width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 4px #c9ee4538;font-style:normal;flex:none}
h1.big{font-family:var(--serif);font-weight:500;letter-spacing:-.05em;line-height:1.05;font-size:clamp(38px,5.4vw,72px)}
h2.mid{font-family:var(--serif);font-weight:500;letter-spacing:-.03em;line-height:1.18;font-size:clamp(26px,3.4vw,40px)}
p.lede{color:#4f5d66;line-height:1.85;max-width:72ch}
.mut{color:var(--muted)}
.crumb{font:10px var(--mono);letter-spacing:.1em;color:var(--muted);padding:16px 0;display:flex;gap:7px;flex-wrap:wrap}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tagrow b{border:1px solid var(--line);background:#ffffff70;padding:6px 11px;font-size:11px;font-weight:650}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:66px;align-items:center;padding:60px 0 72px}
.hero-r{border-left:1px solid var(--line);padding-left:32px}
.hero-r strong{display:block;font:500 21px/1.5 var(--serif);margin-bottom:15px}
.hero-r p{color:var(--muted);line-height:1.8;font-size:13.5px}
.btnrow{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.button{border:1px solid var(--ink);border-radius:3px;padding:12px 20px;font-size:12.5px;font-weight:700;display:inline-block}
.button.primary{background:var(--lime);border-color:var(--lime)}
.button:hover{background:var(--ink);color:var(--white);border-color:var(--ink)}
.button.primary:hover{background:var(--ink);color:var(--lime)}

.band{background:var(--navy);color:#fff}
.band-in{display:grid;grid-template-columns:repeat(5,1fr)}
.band-in span{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:20px;min-height:108px;border-right:1px solid #ffffff1f;font:9px var(--mono);letter-spacing:.09em;color:#9eb0ba}
.band-in span:last-child{border-right:0}
.band-in b{color:var(--lime);font:500 23px var(--serif);letter-spacing:-.02em}

.sechead{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:end;margin-bottom:32px}
.sechead p.lede{font-size:14.5px}

.linegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.linecard{border:1px solid var(--line);background:#ffffff7a;padding:28px;min-height:400px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.linecard:after{content:"";position:absolute;top:-75px;right:-75px;width:150px;height:150px;border-radius:50%;background:var(--acc)}
.linecard:hover{transform:translateY(-4px);box-shadow:0 20px 45px #0d172014}
.linecard>span{font:10px var(--mono);letter-spacing:.08em}
.linecard>p.lbl{margin:50px 0 9px;font:800 10px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.linecard>h2{font:500 29px/1.2 var(--serif);letter-spacing:-.03em;max-width:24ch}
.linecard>small{color:var(--muted);margin-top:10px;font-size:12.5px;line-height:1.7;display:block;max-width:44ch}
.linecard ul{border-top:1px solid var(--line);margin:auto 0 0;padding-top:2px}
.linecard li{border-bottom:1px solid var(--line);padding:10px 0;font-size:12px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.linecard li:last-child{border-bottom:0}
.linecard li em{font-style:normal;font:10px var(--mono);color:var(--muted);white-space:nowrap}

.tw{overflow-x:auto;border:1px solid var(--line);background:#ffffff70}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:12.5px}
th,td{text-align:left;padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
thead th{background:#ffffffa8;font:800 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.k{font-weight:700;white-space:nowrap}
td.m,.m{font:12px var(--mono)}
td.c{white-space:nowrap}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:5px}
.d3{background:var(--ink)} .d2{background:#0d172070} .d1{background:#0d172012;border:1px solid var(--line2)}
.ph{display:inline-block;border:1px solid var(--line2);padding:2px 7px;font:10px var(--mono);border-radius:2px}

.bounds{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.bound{border:1px solid var(--line);background:#ffffff73;padding:24px;border-top:5px solid var(--bc)}
.bound h4{font:800 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.bound>p{font:500 18px/1.4 var(--serif);margin-bottom:15px;letter-spacing:-.01em}
.bound li{font-size:12.5px;line-height:1.65;padding:8px 0;border-top:1px solid var(--line);display:flex;gap:9px}
.bound li:before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--bc);margin-top:8px}

.steps{border-top:1px solid var(--line)}
.steps article{border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px 220px 1fr;gap:24px;align-items:baseline;padding:20px 0}
.steps span{font:11px var(--mono);color:#7d8a92}
.steps h4{font:500 19px var(--serif);letter-spacing:-.015em}
.steps p{color:var(--muted);font-size:13.5px;line-height:1.75}

.solgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.solcard{border:1px solid var(--line);background:#ffffff73;padding:22px 24px;display:flex;flex-direction:column;gap:6px;min-height:152px;transition:background .15s}
.solcard:hover{background:var(--white)}
.solcard span{font:10px var(--mono);letter-spacing:.08em;color:var(--muted)}
.solcard h4{font:500 20px/1.3 var(--serif);letter-spacing:-.02em}
.solcard small{color:var(--muted);font:11.5px var(--mono)}
.solcard b{margin-top:auto;padding-top:12px;font-size:11.5px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center}
.solcard b i{font-style:normal;color:var(--muted)}

.dhero{display:grid;grid-template-columns:150px 1.1fr .9fr;gap:42px;align-items:center;padding:52px 0 62px}
.didx{font:10px var(--mono);letter-spacing:.14em;color:var(--muted);align-self:start;padding-top:12px;line-height:1.9}
.dtitle p.code{display:inline-block;background:var(--acc);padding:8px 12px;font:800 11px var(--mono);letter-spacing:.12em;margin-bottom:16px}
.dtitle h1{font:500 clamp(34px,4.6vw,60px)/1.05 var(--serif);letter-spacing:-.045em}
.dpromise{border-left:1px solid var(--line);padding-left:30px}
.dpromise strong{display:block;font:500 20px/1.5 var(--serif)}
.dpromise p{color:var(--muted);margin:15px 0 0;line-height:1.8;font-size:13.5px}

.endpoint{background:var(--band);border-block:1px solid var(--line)}
.epgrid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-top:24px}
.epgrid div{background:#ffffff73;border-right:1px solid var(--line);padding:22px;min-height:112px}
.epgrid div:last-child{border-right:0}
.epgrid strong{display:block;font:500 30px var(--serif);color:#173042;letter-spacing:-.03em}
.epgrid span{display:block;color:var(--muted);margin-top:7px;font-size:11px;line-height:1.55}

.wf{background:var(--navy);color:#fff}
.wf .kicker{color:#8fa3ae}
.wf h2{color:#fff}
.wf p.lede{color:#c8d5da}
.wftable{overflow-x:auto;margin-top:28px;border-top:1px solid #ffffff2b}
.wftable table{min-width:860px}
.wftable th,.wftable td{border-bottom:1px solid #ffffff1c;color:#d5dfe3;padding:16px 18px}
.wftable th{color:var(--lime);font:800 10px var(--mono);letter-spacing:.1em;background:none;text-transform:uppercase}
.wftable td.n{font:11px var(--mono);color:var(--lime);white-space:nowrap}
.wftable td.f{font:11px var(--mono);color:#9fb4bf;white-space:nowrap}
.wftable td.g{font-size:12px;color:#a9bcc5}

.case4{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:26px}
.case4 article{border:1px solid var(--line);background:#ffffff73;padding:24px;min-height:225px}
.case4 span{font:10px var(--mono);letter-spacing:.1em;color:var(--muted)}
.case4 h4{font:500 21px var(--serif);margin:30px 0 10px;letter-spacing:-.02em}
.case4 p{font-size:12.5px;line-height:1.7;color:#3f4c54}
.exit{background:var(--acc);padding:18px 22px;font-size:12.5px;line-height:1.65;margin-top:2px}

.spec{background:var(--band);border-block:1px solid var(--line)}
.spectable{border:1px solid var(--line);background:#ffffff73}
.spectable>div{display:grid;grid-template-columns:160px 1fr;gap:22px;padding:15px 22px;border-bottom:1px solid var(--line);align-items:baseline}
.spectable>div:last-child{border-bottom:0}
.spectable span{font:800 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spectable p{font-size:13.5px;line-height:1.7}

.rel{display:flex;flex-wrap:wrap;gap:2px;margin-top:20px}
.rel a{border:1px solid var(--line);background:#ffffff73;padding:14px 18px;font-size:12.5px;display:flex;gap:12px;align-items:center;flex:1 1 250px}
.rel a:hover{background:var(--white)}
.rel a em{font-style:normal;font:10px var(--mono);color:var(--muted)}
.rel a i{font-style:normal;margin-left:auto;color:var(--muted)}

.note{border:1px solid var(--line);background:#ffffff8f;padding:18px 22px;font-size:13px;line-height:1.75;color:#3f4c54}
.note b{color:var(--ink)}
.pilot{background:var(--coral);padding:44px 50px;display:flex;justify-content:space-between;align-items:flex-end;gap:42px;flex-wrap:wrap}
.pilot .kicker{color:#733b30}
.pilot h2{font:500 32px/1.2 var(--serif);letter-spacing:-.03em;margin:10px 0 12px}
.pilot p{max-width:64ch;line-height:1.7;font-size:13.5px}

.reflist{border-top:1px solid var(--line)}
.reflist a{display:grid;grid-template-columns:1fr auto;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
.reflist a:hover{background:#ffffff5c}
.reflist em{font-style:normal;font:10px var(--mono);color:var(--muted);word-break:break-all}

.foot{border-top:1px solid var(--line);min-height:110px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px 0}
.foot p{color:var(--muted);font-size:10px;line-height:1.8;max-width:70ch}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

@media (max-width:980px){
  .hero,.dhero,.sechead{grid-template-columns:1fr;gap:26px}
  .hero-r,.dpromise{border-left:0;border-top:1px solid var(--line);padding:24px 0 0}
  .didx{padding:0}
  .linegrid,.solgrid,.bounds,.case4{grid-template-columns:1fr}
  .epgrid,.band-in{grid-template-columns:1fr 1fr}
  .band-in span{border-bottom:1px solid #ffffff1f}
  .steps article{grid-template-columns:48px 1fr;gap:14px}
  .steps p{grid-column:2}
  .spectable>div{grid-template-columns:1fr;gap:6px}
  .nav-links a:not(.nav-cta):not(.lang){display:none}
  .pilot{padding:32px 24px}
}
</style>

const t = v => Array.isArray(v) ? (v[L] !== undefined ? v[L] : v[0]) : v;
const T = v => E(t(v));
const nn = i => String(i+1).padStart(2,'0');
const lineBy = s => D.lines.find(l=>l.slug===s);
const solId = (l,s) => `${l.code}-${s[0]}`;
const findSol = id => { for(const l of D.lines) for(const s of l.sols) if(solId(l,s)===id) return [l,s]; return []; };
const dotv = v => v==="full" ? `<span class="dt d3"></span>${t(["全","full"])}`
  : v==="part" ? `<span class="dt d2"></span>${t(["部分","partial"])}`
  : v==="none" ? `<span class="dt d1"></span>${t(["无","none"])}`
  : v==="?" ? `<span class="dt d1"></span>${t(["待评估","TBD"])}` : T(v);

  </div></header>

  <section class="endpoint"><div class="shell pad-s">
    <p class="kicker">${t(D.ui.spine)}</p>
    <h2 class="mid" style="margin:12px 0 18px">${L===0?`五步骨架，落到「${E(subj)}」。`:`The method spine, applied to "${E(subj)}".`}</h2>
    ${stepsHTML([
      [l.steps[0][0], [`${subj}；${t(l.steps[0][1])}`, `${subj}. ${t(l.steps[0][1])}`][L]],
      l.steps[1], l.steps[2], l.steps[3],
      [l.steps[4][0], [`${t(s[1])}：${t(l.steps[4][1])}`, `${t(s[1])}: ${t(l.steps[4][1])}`][L]]
    ])}
    <p class="kicker" style="margin-top:36px">${t(D.ui.demo)}</p>
    <h2 class="mid" style="margin:10px 0 0">${E(ep)}</h2>
    <div class="epgrid">
      ${chain.map(c=>{const m=c.match(/[~≈]?\d[\d,.]*\s*[万千kK%×]?/);
        const head=m?m[0].trim():c;
        return `<div><strong${m?'':' style="font-size:20px"'}>${E(head)}</strong><span>${E(c)}</span></div>`;}).join('')}
      ${chain.length<4?`<div><strong style="font-size:20px">${E(use)}</strong><span>${t(["应用案例","Use case"])}</span></div>`:''}
      ${chain.length<3?`<div><strong style="font-size:20px">${T(l.price)}</strong><span>${t(["项目范围","Engagement size"])}</span></div>`:''}
    </div>
    <div class="note" style="margin-top:16px">${t(D.ui.demoNote)}</div>
  </div></section>

  <section class="wf"><div class="shell pad">
    <p class="kicker">${t(D.ui.impl)}</p>
    <h2 class="mid" style="margin:12px 0 12px">${t(["把五步方法，落实为可验收的项目流程。","Turning the five-step method into an acceptable project process."])}</h2>
    <p class="lede">${t(D.ui.implLede)}</p>
    <div class="wftable"><table><thead><tr>${cols.map(c=>`<th>${E(c)}</th>`).join('')}</tr></thead><tbody>
      ${phases.map(p=>`<tr><td class="n">${E(p[0])}</td><td>${E(p[1])}</td><td class="f">${E(p[2])}</td><td class="g">${E(p[3])}</td></tr>`).join('')}
    </tbody></table></div>
  </div></section>

  <section class="shell pad" style="--acc:${l.acc}">
    <p class="kicker">${t(D.ui.case)}</p>
    <h2 class="mid" style="margin:12px 0 10px">${T(s[1])}${L===0?"：从项目输入到下一轮实验。":": from project input to the next round."}</h2>
    <p class="lede">${t(D.ui.caseLede)}</p>
    <div class="case4">
      <article><span>01 / INPUT</span><h4>${E(ch[0])}</h4><p>${L===0?`${E(subj)}。启动时冻结原始数据、项目目标、实验容量、硬约束及对照设计。`:`${E(subj)}. At kickoff, freeze the raw data, objective, experimental capacity, hard constraints and control design.`}</p></article>
      <article><span>02 / COMPUTE</span><h4>${E(ch[1])}</h4><p>${T(l.gen)} ${T(l.cal)}</p></article>
      <article><span>03 / DECIDE</span><h4>${E(ch[2])}</h4><p>${T(l.sel)}</p></article>
      <article><span>04 / LAB</span><h4>${E(ch[3])}</h4><p>${T(l.out)} ${T(l.loop)}</p></article>
    </div>
    <div class="exit"><b>CASE EXIT</b>　${T(l.exit)}　·　${T(l.formats)}</div>
    <div class="note" style="margin-top:22px"><b>${t(D.ui.boundLine)}.</b>
      ${t(D.ui.okL)}: ${T(l.bounds[0])}. ${t(D.ui.midL)}: ${T(l.bounds[1])}.
      <b>${t(D.ui.noL)}: ${T(l.bounds[2])}</b>.</div>
  </section>

  <section class="spec"><div class="shell pad-s">
    <p class="kicker">Standard deliverables</p>
    <h2 class="mid" style="margin:12px 0 22px">${t(["从输入数据到实验可用资产","From input data to lab-ready assets"])}</h2>
    ${specHTML(l,s)}
  </div></section>

  <section class="shell pad-s">
    <p class="kicker">${t(D.ui.related)}</p>
    <h2 class="mid" style="margin:12px 0 4px">${E(l.name)}</h2>
    <div class="rel">${l.sols.filter(x=>x!==s).map(x=>
      `<a href="#/catalog/${solId(l,x)}"><em>${E(solId(l,x))}</em>${T(x[1])}<i>↗</i></a>`).join('')}</div>
  </section>
  ${foot()}`;
}

/* ============ router ============ */
function navHTML(){
  const other = LANG==='zh' ? 'EN' : '中文';
  return `<a href="#/">${t(D.ui.overview)}</a><a href="#/matrix">${t(D.ui.matrix)}</a>
    <a href="#/bounds">${t(D.ui.bounds)}</a><a href="#/validate">${t(D.ui.validate)}</a>
    <a href="#/refs">${t(D.ui.refs)}</a>
    <a class="nav-cta" href="#/lines/celltwin-ai">${t(D.ui.pilot)}</a>
    <a class="lang" href="#" id="langbtn">${other}</a>`;
}
function render(){
  const r=(location.hash.slice(1)||'/').split('?')[0];
  let html;
  if(r.startsWith('/lines/')) html=pageLine(r.slice(7));
  else if(r.startsWith('/catalog/')) html=pageSolution(r.slice(9));
  else if(r==='/matrix') html=pageMatrix();
  else if(r==='/bounds') html=pageBounds();
  else if(r==='/validate') html=pageValidate();
  else if(r==='/refs') html=pageRefs();
  else html=pageFamily();
  document.getElementById('app').innerHTML=html;
  document.getElementById('navlinks').innerHTML=navHTML();
  const b=document.getElementById('langbtn');
  if(b) b.onclick=e=>{e.preventDefault();LANG=LANG==='zh'?'en':'zh';L=LANG==='zh'?0:1;
    try{document.documentElement.lang=LANG==='zh'?'zh-CN':'en';}catch(_){}
    render();};
  window.scrollTo({top:0,behavior:'instant'});
}
L = LANG==='zh'?0:1;
window.addEventListener('hashchange',render);
render();
</script>
