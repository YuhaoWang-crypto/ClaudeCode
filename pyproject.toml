[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lipidlib"
version = "0.0.1"
description = "AI-guided lipid / targeting-ligand library screening for LNP mRNA delivery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2024.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "requests>=2.28",
]

[tool.setuptools]
packages = ["lipidlib"]
